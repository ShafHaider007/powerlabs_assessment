[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roofsolar"
version = "0.1.0"
description = "3D roof reconstruction and solar panel placement from DSM and RGB aerial imagery"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "opencv-python-headless>=4.9",
    "shapely>=2.0",
    "trimesh>=4.0",
    "open3d>=0.18",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
