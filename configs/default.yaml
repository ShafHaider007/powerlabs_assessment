# Pipeline configuration. Every tunable value lives here, not in the code.
# Units: metres and degrees unless noted otherwise.

paths:
  dsm: data/raw/dsm_clipped.tif        # area of interest (property polygon); NoData outside
  dsm_full: data/raw/dsm_full.tif      # same grid, larger extent, no NoData
  rgb: data/raw/rgb.tif                # aligned with dsm_full
  output_dir: outputs
  obstruction_reference: data/reference/obstructions_reference.json  # hand labels (recall check)

# ---------------------------------------------------------------- step 1
terrain:
  # Derivatives are computed on the full DSM and then cropped to the AOI, so pixels
  # on the AOI boundary use real neighbours instead of a fake edge.
  edge_mode: extrapolate               # outer frame of the tile: extrapolate | nan
  true_north: true                     # rotate aspect from UTM grid north to true north
  # Below this slope the aspect is noise, not a facing direction -> NaN.
  # "auto" = the flat_noise_percentile of slope measured on open flat ground, i.e. the
  # slope that DSM noise alone produces (see docs/progress.md, step 1). Or give a number.
  flat_slope_deg: auto
  flat_noise_percentile: 95

ground:                                # bare-ground model (DTM) via morphological opening
  cell_m: 1.0                          # working resolution for the large filter
  window_m: 31.0                       # must be wider than the largest building (~26 m)
  smooth_sigma_m: 2.0

diagnostics:
  noise_window_px: 15                  # 1.5 m tiles for the plane-residual noise estimate
  noise_percentile: 10                 # flattest 10 % of tiles = sensor noise floor
  ground_max_height_m: 0.3             # nDSM below this counts as ground (noise check)
  ground_buffer_m: 1.0                 # skip ground within 1 m of raised objects (wall bases, hedges)
  # Data provenance: the raw DSM stores heights in 1 cm steps; regions with off-grid
  # heights were re-processed by the provider (found in step 1). Diagnostic only.
  height_quantum_m: 0.01
  off_grid_window_px: 11
  off_grid_min_density: 0.5
  # Rough roof-candidate filter used only for the step-1 aspect preview.
  # Step 3 replaces it with proper face segmentation.
  roof_min_height_m: 2.5
  roof_slope_range_deg: [15, 60]

# ---------------------------------------------------------------- step 2
cleaning:
  # TGV² regularisation (piecewise-planar prior). Chosen by scripts/benchmark_cleaning.py:
  # best on a synthetic roof degraded like this DSM (blurred edges + 2.5 cm waviness),
  # confirmed on the real roof (normal scatter 3.1 -> 1.2 deg, ridges lowered ~1.5 cm).
  tgv_alpha1: 0.05                     # first-order weight (m per pixel gradient)
  tgv_alpha0: 0.2                      # second-order weight (change of slope)
  tgv_max_iter: 4000
  tgv_tol_m: 1.0e-6                    # stop when RMS change per iteration < this
  # Outliers: local Hampel test on (data - TGV) + amplitude-relative isolation test.
  # Validated by planting 150 spikes: 95 % recall (100 % on the roof).
  outlier_k: 6.0
  outlier_window_px: 7
  outlier_max_blob_m2: 0.25            # larger deviations are real objects, not errors
  outlier_background_px: 11
  # Vegetation (Excess Green index on the RGB): canopy heights are not roof heights.
  vegetation_exg_threshold: auto       # auto = Otsu threshold inside the AOI
  # Normal-scatter check on planar roof tiles (same tiles before and after cleaning)
  check_tile_px: 15
  check_tile_max_resid_m: 0.03

# ---------------------------------------------------------------- step 3
faces:
  # Footprint: true wall line at ~half eave height; walls are smeared over 0.5-0.8 m and the
  # steepest point of the smear (= wall position) sits at nDSM 1.4-2.2 m (measured).
  min_height_m: 1.5
  crease_gap_m: 0.10                   # planes closer than this on the boundary meet = crease
  consistency_max_angle_deg: 5.0       # boundary vs plane-intersection direction
  consistency_min_offset_m: 0.15       # or 3 x expected line uncertainty if larger
  segment:
    max_grow_slope_deg: 70.0           # steeper = smeared wall, not roof
    seed_max_planarity_deg: 3.0        # seeds: normal within 3 deg of its 5x5 mean
    grow_angle_deg: 10.0               # ~8x the cleaned normal scatter (1.25 deg)
    grow_dist_m: 0.10                  # ~4x the face waviness (2.5 cm)
    min_face_m2: 1.0
    core_erosion_m: 0.3                # sliver test: erode 0.3 m ...
    min_core_frac: 0.15                # ... at least 15 % must survive (real faces: 40-78 %)
    merge_angle_deg: 5.0
    merge_rmse_m: 0.04
    merge_max_ratio: 1.3               # union RMSE <= 1.3 x pooled RMSE of the two planes
    merge_gap_m: 0.5
    max_face_rmse_m: 0.05              # 2x the measured waviness; worse = mixed segment
    assign_radius_m: 1.0               # a pixel may join faces within 1 m of it
    assign_tol_m: 0.25                 # above this it is an object (chimney >= 0.3 m)
    assign_iterations: 3
    eave_band_m: 1.0                   # smeared-wall band rebuilt from the plane

# ---------------------------------------------------------------- step 4
obstructions:
  # Raised objects: raw DSM height above the face plane. Raw noise on faces is 4.1 cm, so
  # 0.15 m is ~3.5 sigma.
  min_height_m: 0.15
  open_radius_m: 0.1                   # removes 1-pixel specks before labelling
  eave_band_m: 1.0                     # rebuilt-eave band: below-plane data there is smear
  min_depression_m2: 0.25
  # Glass faces: glazing frames (contrast) AND specular reflection (bright) - both required.
  glass_min_contrast: 6.0              # median 5x5 lightness std (tiles <= 5.3, lantern >= 8.2)
  glass_bright_l: 80.0                 # CIELAB L
  glass_min_bright_frac: 0.10          # tiles <= ~8 %, lantern faces 10-40 %
  # Flush objects: colour distance from the same face's tiles (Mahalanobis, MCD covariance)
  colour_threshold: 5.0                # found all 9 reference objects (6 missed vent + flue)
  colour_min_m2: 0.04
  colour_max_m2: 6.0
  colour_max_elongation: 4.0           # longer = capping / valley strip, not an object
  colour_min_width_m: 0.2
  dark_delta_l: -10.0                  # darker than the face -> "dark anomaly" (shadow or fitting)
  # Classification of raised objects
  vegetation_frac: 0.3
  vegetation_min_height_m: 4.0
  structure_min_m2: 2.5
  chimney_min_height_m: 0.4
  chimney_max_elongation: 3.0          # longer raised strips are dormer cheeks / wall smear
  # Keep-out: the DSM smear around raised objects decays to noise level at 0.3-0.4 m
  # (measured), which is also a sensible installation clearance.
  buffer_m: 0.3

# ---------------------------------------------------------------- step 5
model3d:
  # 1.5 px: removes the pixel staircase; max face-area change 1.4 %, zero overlaps (measured)
  simplify_tolerance_m: 0.15
  # Vertices may move this far (in plan) onto plane intersections: ~3 px, within the
  # wall/crease smear and the step-3 boundary uncertainty
  max_snap_m: 0.3
  min_object_m2: 0.1                   # raised obstructions modelled as prisms

figures:
  # Cross-section lines in AOI pixel coordinates: [col, row, azimuth_deg, length_m, label]
  profiles:
    - [330, 420, 44, 40, "A: SW-NE across the main roof"]
    - [380, 330, 134, 40, "B: NW-SE along the NE ridge"]
    - [360, 370, 44, 40, "C: through the central lantern"]
